<!-- Course Library accessibility shim.

     Quarto generates the listing's Filter box as a bare
     `<input type="text" class="search form-control" placeholder="Filter">`
     with no id, no <label> and no aria-label. Placeholder is the last
     resort in the accessible-name computation and disappears the moment
     the user types, so the control is effectively unlabelled — WCAG 3.3.2.
     That markup comes from Quarto's own _filter.ejs.md, injected during
     post-render, so there is no template hook and no Lua filter that can
     reach it. This is the smallest fix that works.

     It attaches a real <label for=...>, not an ARIA patch, per the
     repository's preference for native semantics. It also hides the two
     decorative Bootstrap glyphs from assistive technology, since they
     carry no text and duplicate the adjacent control's meaning.

     Quarto's mouse-only category chips are suppressed in courses.qmd
     (`categories: false`). The browse links in the page body are real
     anchors, keyboard-operable at every width, and deliberately a short
     shortlist rather than a chip for every category — statuses and
     groupings without a link stay reachable through the search box,
     which matches on those fields. So nothing here rebuilds the chips.
     What those links cannot do on their own is show
     which filter is currently applied — the page is a static document
     and the filter lives in the URL hash — so the second block below
     marks the matching link with a class and aria-current, on first
     load and on every hash change, including the unfiltered All state. -->
<script>
  (function () {
    // Quarto's listing hash is query-shaped: "#category=Name&other=x".
    function categoryFromHash(hash) {
      var h = (hash || "").replace(/^#/, "");
      if (!h) return null;
      var found = null;
      h.split("&").forEach(function (pair) {
        var i = pair.indexOf("=");
        if (i < 0) return;
        if (pair.slice(0, i) !== "category") return;
        var raw = pair.slice(i + 1);
        try { found = decodeURIComponent(raw); } catch (e) { found = raw; }
      });
      // An empty category does not filter, so it is the All state.
      return found ? found : null;
    }

    function markActiveFacet() {
      var links = document.querySelectorAll(".course-facets a");
      if (!links.length) return;
      var current = categoryFromHash(window.location.hash);
      links.forEach(function (a) {
        var mine = categoryFromHash(a.hash);
        var active = mine === current;
        a.classList.toggle("is-active", active);
        if (active) {
          a.setAttribute("aria-current", "true");
          // Defensive: no browse link currently sits inside a <details>,
          // so this branch does not fire today. It stays because content
          // in a closed <details> is painted for nobody and is dropped
          // from the accessibility tree — if a link ever moves back into
          // a disclosure, deep-linking to it would otherwise show a
          // filtered catalog with every visible control reading inactive
          // and nothing on the page saying why.
          var box = a.closest("details");
          if (box && !box.open) box.open = true;
        } else {
          a.removeAttribute("aria-current");
        }
      });
    }

    function labelListingControls() {
      document.querySelectorAll(".quarto-listing").forEach(function (listing, i) {
        var input = listing.querySelector(".quarto-listing-filter input.search");
        if (input && !input.id) {
          input.id = "listing-filter-" + (listing.id || i);
          var label = document.createElement("label");
          label.setAttribute("for", input.id);
          label.className = "visually-hidden";
          label.textContent = "Filter courses by title, code, level, status, or curriculum grouping";
          input.parentNode.insertBefore(label, input);
        }
        listing.querySelectorAll(".input-group-text > i.bi").forEach(function (icon) {
          icon.setAttribute("aria-hidden", "true");
        });
      });
    }
    function init() {
      labelListingControls();
      markActiveFacet();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
    // Activating a facet link is a same-document fragment navigation, so the
    // page does not re-run init; hashchange is what keeps the marker honest.
    window.addEventListener("hashchange", markActiveFacet);
  })();
</script>
