project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"

  # Registry gate. courses.yml is the authoritative course source, so a
  # violation must stop the render rather than reach the Course Library.
  # Fails closed: a violated invariant, malformed YAML, a missing registry,
  # or a missing PyYAML all exit nonzero and abort the render. PyYAML is
  # installed explicitly in .github/workflows/publish.yml so the Pages build
  # runs the same gate. Requires PyYAML locally too: python -m pip install PyYAML
  pre-render:
    - tools/validate_courses.py

  resources:
    - assets/images/course-motifs/thumbs/*.webp
website:
  title: "Matt Hester"
  site-url: https://matthewhester.com
  description: |
    Matt Hester — statistician, teacher, and researcher at UA Little Rock.
    Bayesian evidence synthesis, public course materials, and human-governed
    systems for building reproducible courses.
  image: assets/images/brand/og-default-og.jpg
  open-graph: true
  twitter-card: true
  # TODO(Phase 4C): favicon. Drop a 32x32 .ico and matching .svg into
  # assets/images/brand/ and uncomment:
  # favicon: assets/images/brand/favicon.ico

  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: teaching.qmd
        text: Teaching
      # The canonical course inventory earns a top-level slot: it is reachable
      # from anywhere, not just the Teaching sidebar. See
      # TEACHING_PORTFOLIO_ARCHITECTURE.md section 2. Seven items is the
      # ceiling in BRAND_STYLE_BRIEF.md — no further teaching destinations.
      - href: courses.qmd
        text: Courses
      - href: research.qmd
        text: Research
      - href: cv.qmd
        text: CV
      - href: contact.qmd
        text: Contact

  # Teaching sidebar — navigation WITHIN teaching.qmd and nothing else. Every
  # entry is an anchor to a section that actually lives on that page: an entry
  # pointing at another destination, or one that enumerates individual courses,
  # is a defect (TEACHING_PORTFOLIO_ARCHITECTURE.md section 2). The Course
  # Library is a standalone page reached from the navbar, carries no sidebar,
  # and is where Course Builder now lives. teaching.qmd is the only page that
  # opts in, via `sidebar: teaching`.
  sidebar:
    - id: teaching
      title: "Teaching"
      style: floating
      collapse-level: 2
      contents:
        - text: "Teaching overview"
          href: teaching.qmd
        - text: "Current courses"
          href: teaching.qmd#current-courses
        - text: "Teaching approach"
          href: teaching.qmd#teaching-approach
        - text: "Math Assistance Center"
          href: teaching.qmd#math-assistance-center

  page-footer:
    left: "© 2026 Matt Hester"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false
    fontsize: 1.05em
    mainfont: "Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    monofont: "JetBrains Mono, Consolas, Menlo, monospace"
