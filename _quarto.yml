project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"

  resources:
    - assets/images/course-motifs/thumbs/*.webp
website:
  title: "Matt Hester"
  site-url: https://matthewhester.com
  description: |
    Matt Hester — statistician, teacher, and researcher at UA Little Rock.
    Bayesian evidence synthesis, public course materials, and human-governed
    systems for building reproducible courses.
  image: assets/images/brand/og-default-og.jpg
  open-graph: true
  twitter-card: true
  # TODO(Phase 4C): favicon. Drop a 32x32 .ico and matching .svg into
  # assets/images/brand/ and uncomment:
  # favicon: assets/images/brand/favicon.ico

  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: teaching.qmd
        text: Teaching
      - href: research.qmd
        text: Research
      - href: cv.qmd
        text: CV
      - href: contact.qmd
        text: Contact

  # Course directory sidebar — scoped to the teaching page only (no other
  # page is listed in its contents, so no other page shows it). Course
  # items link straight to the live course sites; section headers jump to
  # the matching section of the teaching page.
  sidebar:
    - id: teaching
      title: "Courses"
      style: floating
      collapse-level: 3
      contents:
        - text: "Teaching overview"
          href: teaching.qmd
        - section: "Current courses"
          href: teaching.qmd#current-courses
          contents:
            - text: "Intro to Mathematical Software"
              href: /math-software/
            - text: "Intro to Statistics"
              href: /intro-stats/
        - section: "Undergraduate course sites"
          href: teaching.qmd#undergraduate-course-sites
          contents:
            - text: "Bayesian Statistics"
              href: /bayesian-statistics/
            - text: "Introduction to Probability"
              href: /intro-probability/
            - text: "Statistical Inference"
              href: /statistical-inference/
            - text: "Statistical Modeling"
              href: /statistical-modeling/
            - text: "Modern SAS for Statistical Analytics"
              href: /modern-sas/
            - text: "Design, Experiments & Causal Evidence"
              href: /statistical-design/
            - text: "Applied Statistical Methods"
              href: /applied-statistics/
            - text: "Resampling, Nonparametric & Robust Methods"
              href: /nonparametrics/
        - section: "Graduate course sites"
          href: teaching.qmd#graduate-course-sites
          contents:
            - text: "In development"
              href: teaching.qmd#graduate-course-sites
        - text: "Course Builder"
          href: teaching.qmd#course-builder
        - text: "Teaching approach"
          href: teaching.qmd#teaching-approach
        - text: "Math Assistance Center"
          href: teaching.qmd#math-assistance-center

  page-footer:
    left: "© 2026 Matt Hester"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false
    fontsize: 1.05em
    mainfont: "Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    monofont: "JetBrains Mono, Consolas, Menlo, monospace"
