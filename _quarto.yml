project:
  type: website
  output-dir: _site
  # Render the hub's own pages and nothing else. A Quarto render glob with
  # no leading slash matches at ANY depth, so "*.qmd" alone also renders
  # every course repo that publish.yml checks out inside this folder as
  # course-<name>/. That published a second, hub-themed copy of each course
  # site at /course-<name>/ and put all of it in the hub's sitemap and
  # search index. It never shows in a local render, where those folders do
  # not exist. The exclusion keeps the hub render to the hub, and
  # publish.yml fails the deploy if a course-* folder still reaches _site/.
  render:
    - "*.qmd"
    - "!course-*/"

  # Registry gate. courses.yml is the authoritative course source, so a
  # violation must stop the render rather than reach the Course Library.
  # Fails closed: a violated invariant, malformed YAML, a missing registry,
  # or a missing PyYAML all exit nonzero and abort the render. PyYAML is
  # installed explicitly in .github/workflows/publish.yml so the Pages build
  # runs the same gate. Requires PyYAML locally too: python -m pip install PyYAML
  pre-render:
    - tools/validate_courses.py

  # Images the Course Library template names. A listing template's <img>
  # paths are not discovered by Quarto, so they are declared here: the
  # course marks the Library rows show, and the hero thumbnails that
  # index.qmd and teaching.qmd name in srcset.
  resources:
    - assets/images/course-motifs/thumbs/*.webp
    - assets/images/course-motifs/marks/*.webp
website:
  title: "Matt Hester"
  site-url: https://matthewhester.com
  description: |
    Matt Hester — statistician, teacher, and researcher at UA Little Rock.
    Bayesian evidence synthesis, public course materials, and human-governed
    systems for building reproducible courses.
  image: assets/images/brand/og-default-og.jpg
  open-graph: true
  twitter-card: true
  # A plain monogram in the navbar's own colors, written by
  # tools/make_favicon.py. Until 2026-11-13 the site had no favicon and
  # every browser tab showed the default icon.
  favicon: assets/images/brand/favicon.png

  navbar:
    pinned: true
    # No "Home" item: the name at the left of the bar is the home link.
    left:
      - href: about.qmd
        text: About
      - href: teaching.qmd
        text: Teaching
      # The canonical course inventory earns a top-level slot: it is reachable
      # from anywhere. See TEACHING_PORTFOLIO_ARCHITECTURE.md section 2. Seven
      # items is the ceiling in BRAND_STYLE_BRIEF.md — no further teaching
      # destinations.
      - href: courses.qmd
        text: Courses
      - href: research.qmd
        text: Research
      - href: cv.qmd
        text: CV
      - href: contact.qmd
        text: Contact

  # No sidebar anywhere on the hub. Teaching had one until 2026-11-13: four
  # anchors to sections of that one page. It was the reason Teaching's title
  # sat 150-320px to the right of every other page's, and the page is short
  # enough to scan without it. Every hub page now shares one column (see "One
  # column" in styles.css). TEACHING_PORTFOLIO_ARCHITECTURE.md section 2 still
  # describes that sidebar; its rule that Teaching must not become a second
  # course directory is unaffected.

  page-footer:
    left: "© 2026 Matt Hester"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false
    fontsize: 1.05em
    mainfont: "Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    monofont: "JetBrains Mono, Consolas, Menlo, monospace"
