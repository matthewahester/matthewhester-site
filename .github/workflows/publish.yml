name: Publish to GitHub Pages

# Manual-only at first. Switching to push-on-main is a separate,
# deliberate change once we've confirmed a few manual deploys
# produce a healthy combined site.
on:
  workflow_dispatch:

permissions:
  contents: read   # checkout of this repo and public course repos
  pages: write     # deploy-pages
  id-token: write  # OIDC for deploy-pages

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # --- 1. Hub repo ------------------------------------------------
      - name: Checkout matthewhester-site (hub)
        uses: actions/checkout@v5
        # No `path:` → checks out at the workflow's working directory.

      # --- 2. Course repos --------------------------------------------
      # All eight course repos are PUBLIC; the default GITHUB_TOKEN is
      # enough for `actions/checkout` to read them. If any repo
      # becomes private, add `token: ${{ secrets.COURSE_REPOS_PAT }}`
      # to that step and create a PAT with `repo` (read) scope.
      #
      # NOTE: each course repo must exist as a public GitHub repo under
      # matthewahester/ before this workflow can check it out
      # (modern-sas and statistical-design added 2026-06-17).
      - name: Checkout math-software (course)
        uses: actions/checkout@v5
        with:
          repository: matthewahester/math-software
          ref: main
          path: course-math-software

      - name: Checkout intro-stats (course)
        uses: actions/checkout@v5
        with:
          repository: matthewahester/intro-stats
          ref: main
          path: course-intro-stats

      - name: Checkout bayesian-statistics (course)
        uses: actions/checkout@v5
        with:
          repository: matthewahester/bayesian-statistics
          ref: main
          path: course-bayesian-statistics

      - name: Checkout intro-probability (course)
        uses: actions/checkout@v5
        with:
          repository: matthewahester/intro-probability
          ref: main
          path: course-intro-probability

      - name: Checkout statistical-inference (course)
        uses: actions/checkout@v5
        with:
          repository: matthewahester/statistical-inference
          ref: main
          path: course-statistical-inference

      - name: Checkout statistical-modeling (course)
        uses: actions/checkout@v5
        with:
          repository: matthewahester/statistical-modeling
          ref: main
          path: course-statistical-modeling

      - name: Checkout modern-sas (course)
        uses: actions/checkout@v5
        with:
          repository: matthewahester/modern-sas
          ref: main
          path: course-modern-sas

      - name: Checkout statistical-design (course)
        uses: actions/checkout@v5
        with:
          repository: matthewahester/statistical-design
          ref: main
          path: course-statistical-design

      - name: Checkout applied-statistics (course)
        uses: actions/checkout@v5
        with:
          repository: matthewahester/applied-statistics
          ref: main
          path: course-applied-statistics

      - name: Checkout nonparametrics (course)
        uses: actions/checkout@v5
        with:
          repository: matthewahester/nonparametrics
          ref: main
          path: course-nonparametrics

      # --- 3. Quarto --------------------------------------------------
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # --- 3b. Executable-visual runtime (conditional) ----------------
      # Most teaching content shows code WITHOUT executing, so R/Python are
      # usually not needed. But a course that ships executable figures (e.g.
      # ```{r} chunks producing plots) needs R + knitr at render time, or the
      # render silently drops the figures. We do NOT install R for every deploy.
      #
      # CI cannot see the private build metadata (_state/visual_plans/ with
      # generation_engine: quarto_r lives only in the Drive build, never in the
      # public repos). So CI keys off the PUBLIC-SAFE proxy it CAN see: whether
      # the content it is about to render contains executable code chunks. The
      # authoritative visual-plan gate (check-release.py --render-ready) runs
      # LOCALLY before a quarto_r course is promoted to its public repo
      # (course-builder docs/24 §6c, templates/release_checklist.md).
      - name: Detect executable Quarto chunks (decide if R/Python are needed)
        id: detect
        run: |
          set -euo pipefail
          if grep -rIlE '^[[:space:]]*```\{r[ ,}]' --include='*.qmd' --include='*.md' . >/dev/null 2>&1; then
            echo "needs_r=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_r=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -rIlE '^[[:space:]]*```\{python[ ,}]' --include='*.qmd' --include='*.md' . >/dev/null 2>&1; then
            echo "needs_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_python=false" >> "$GITHUB_OUTPUT"
          fi
          echo "executable R chunks present: $(grep -rIlE '^[[:space:]]*```\{r[ ,}]' --include='*.qmd' --include='*.md' . 2>/dev/null | wc -l) file(s)"

      - name: Set up R (only if a rendered repo has executable R chunks)
        if: steps.detect.outputs.needs_r == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R render deps + verify runtime (fail fast)
        if: steps.detect.outputs.needs_r == 'true'
        run: |
          set -euo pipefail
          Rscript -e 'install.packages(c("knitr","rmarkdown"))'
          Rscript -e 'cat("R", as.character(getRversion()), "| knitr", as.character(packageVersion("knitr")), "| rmarkdown", as.character(packageVersion("rmarkdown")), "\n")'
          quarto check knitr   # render-ready gate: fail BEFORE render if the R runtime is not ready

      - name: Set up Python (only if a rendered repo has executable Python chunks)
        if: steps.detect.outputs.needs_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # --- 4. Render --------------------------------------------------
      - name: Render hub
        run: quarto render

      - name: Render math-software
        run: quarto render
        working-directory: course-math-software

      - name: Render intro-stats
        run: quarto render
        working-directory: course-intro-stats

      # bayesian-statistics ships executable {r} figures, so it needs the
      # R runtime installed above (the detect step finds its chunks and
      # flips needs_r=true). intro-probability is eval:false and renders
      # without R.
      - name: Render bayesian-statistics
        run: quarto render
        working-directory: course-bayesian-statistics

      - name: Render intro-probability
        run: quarto render
        working-directory: course-intro-probability

      # statistical-inference and statistical-modeling use static (non-executed)
      # ```r fences, so they render deterministically without R.
      - name: Render statistical-inference
        run: quarto render
        working-directory: course-statistical-inference

      - name: Render statistical-modeling
        run: quarto render
        working-directory: course-statistical-modeling

      # modern-sas (static ```sas, synthetic logs) and statistical-design
      # (static ```r) render deterministically without SAS or R.
      - name: Render modern-sas
        run: quarto render
        working-directory: course-modern-sas

      - name: Render statistical-design
        run: quarto render
        working-directory: course-statistical-design

      # applied-statistics and nonparametrics use static (non-executed) ```r
      # fences, so they render deterministically without R.
      - name: Render applied-statistics
        run: quarto render
        working-directory: course-applied-statistics

      - name: Render nonparametrics
        run: quarto render
        working-directory: course-nonparametrics

      # --- 5. Assemble combined artifact ------------------------------
      # Copy CONTENTS of each course _site/ into the matching
      # subdirectory under the hub _site/. The trailing `/.` is
      # important — without it, `cp -r src dst` copies the directory
      # itself and produces `_site/math-software/_site/...`.
      - name: Assemble combined _site/
        run: |
          mkdir -p _site/math-software _site/intro-stats _site/bayesian-statistics _site/intro-probability _site/statistical-inference _site/statistical-modeling _site/modern-sas _site/statistical-design _site/applied-statistics _site/nonparametrics
          cp -r course-math-software/_site/. _site/math-software/
          cp -r course-intro-stats/_site/. _site/intro-stats/
          cp -r course-bayesian-statistics/_site/. _site/bayesian-statistics/
          cp -r course-intro-probability/_site/. _site/intro-probability/
          cp -r course-statistical-inference/_site/. _site/statistical-inference/
          cp -r course-statistical-modeling/_site/. _site/statistical-modeling/
          cp -r course-modern-sas/_site/. _site/modern-sas/
          cp -r course-statistical-design/_site/. _site/statistical-design/
          cp -r course-applied-statistics/_site/. _site/applied-statistics/
          cp -r course-nonparametrics/_site/. _site/nonparametrics/

      # --- 6. Tidy ---------------------------------------------------
      # The hub CNAME is the only one that matters at the artifact
      # root. Any per-course CNAME files would be ignored by Pages
      # but are dead weight; remove them.
      - name: Ensure root CNAME and drop nested ones
        run: |
          cp CNAME _site/CNAME
          find _site -mindepth 2 -name CNAME -print -delete

      # --- 7. Upload + deploy ----------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
