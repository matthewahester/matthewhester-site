# Course registry — the authoritative source for every public course record.
#
# Governed by TEACHING_PORTFOLIO_ARCHITECTURE.md section 6. Read by the
# Course Library (courses.qmd) through Quarto's native listing facility.
# Nothing else on the site should restate a course title, status, summary,
# or URL: change it here and the Library follows.
#
# Fields
#   title      required. Course name as the public site shows it.
#   code       optional. University catalog number. Omit when not known.
#   level      required. Undergraduate | Graduate.
#   kind       required. site | course | direction.
#                site      a public course-material site exists; the record links to it.
#                course    a real catalog course with no public site; never links.
#                direction planning-stage curriculum area; never links.
#   status     required. Public-material status, not the course's existence:
#                Current offering | Maintained public reference | In development
#                | No public materials yet | Curriculum direction | Archived resource
#   group      required. Curriculum grouping, shared across levels.
#   summary    required. One sentence on what the course covers.
#   path       ONLY for kind: site. The public URL. Absent means non-clickable.
#   image      optional. Existing hero thumbnail. Absent is fine.
#   reviewed   optional. Last substantive review date. NEVER invent one; omit
#              until a real review date is curated.
#   categories derived index of [level, status, group] so Quarto's listing can
#              filter on all three. Mirror the typed fields above; do not add
#              values that are not already one of them.
#
# Unknown values are omitted, never guessed. See section 6 of the control.

